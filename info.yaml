intro: "In dedicated projects and teams, L42i's VIP explores how we can interact with spatial audio - in artistic and scientific contexts. Many of our projects use 3D multichannel loudspeaker systems, running on Linux Audio servers. Our work combines design and engineering with creative applications and methods from Human Computer Interaction research. By combining concerts, installations, and experiments we have a holistic perspective, ideal for interdisciplinary teams."
